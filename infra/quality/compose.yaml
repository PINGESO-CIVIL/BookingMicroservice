name: bookingms-quality

services:
  database:
    image: postgres:17.11-alpine3.23@sha256:05aa77262db9277fde6374bb2f901c9604b8a9373029e1a7993440c6aae48736
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run scripts/quality.ps1 Init first}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    depends_on:
      database:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://database:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Run scripts/quality.ps1 Init first}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24
    restart: unless-stopped

  scanner:
    image: sonarsource/sonar-scanner-cli:12.3.0.4285_8.1.0@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7
    profiles: [tools]
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ../..:/usr/src:ro
      - ../../reports:/usr/src/reports
      - scanner_cache:/opt/sonar-scanner/.sonar

  trivy:
    image: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    profiles: [tools]
    working_dir: /workspace
    environment:
      TRIVY_CACHE_DIR: /cache
    volumes:
      - ../..:/workspace:ro
      - ../../reports:/workspace/reports
      - trivy_cache:/cache

volumes:
  database_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  scanner_cache:
  trivy_cache:
