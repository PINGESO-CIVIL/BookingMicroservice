format: table
exit-code: 1
timeout: 10m
severity:
  - HIGH
  - CRITICAL
pkg:
  include-dev-deps: true
scan:
  scanners:
    - vuln
    - misconfig
    - secret
  skip-dirs:
    - .git
    - .quality
    - reports
    - .scannerwork
    - node_modules
    - apps/api/bin
    - apps/web/dist
    - apps/web/package-dist
    - apps/web/test-results
    - apps/web/playwright-report
vulnerability:
  ignore-unfixed: true
