name: bookingms-demo

x-database-client: &database-client
  DATABASE_URL: &bookingms-dsn postgres://bookingms@postgres:5432/bookingms?sslmode=disable
  PGPASSWORD: ${BOOKING_DB_PASSWORD:-bookingms-local-demo}

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_DB: bookingms
      POSTGRES_USER: bookingms
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-bookingms-local-demo}
    volumes:
      - bookingms_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, bookingms, -d, bookingms]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: bookingms/migrate:demo
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *bookingms-dsn
      PGPASSWORD: ${BOOKING_DB_PASSWORD:-bookingms-local-demo}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  backend:
    image: bookingms/api:demo
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *database-client
      MOCK_ADDR: 0.0.0.0:8080
      API_ENV: ${API_ENV-dev}
      BOOKING_JWT_ISSUER: ${BOOKING_JWT_ISSUER:-}
      BOOKING_JWT_AUDIENCE: ${BOOKING_JWT_AUDIENCE:-}
      BOOKING_JWKS_URL: ${BOOKING_JWKS_URL:-}
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-}
      NOTIFICACIONES_DEMO_DESTINATARIO: ${NOTIFICACIONES_DEMO_DESTINATARIO:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5191:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  frontend:
    image: bookingms/frontend:demo
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    environment:
      BOOKING_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:5190:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  bookingms_data:
