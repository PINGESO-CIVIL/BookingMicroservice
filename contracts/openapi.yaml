components:
  examples:
    CancelRequest:
      summary: Cancelación con la versión consultada
      value:
        expectedVersion: 1
    AdminReservationPage:
      summary: Reserva de otro usuario visible para el administrador de su ámbito.
      value:
        items:
          - id: 00000000-0000-4000-8000-200000000005
            resourceId: 00000000-0000-4000-8000-100000000002
            responsible:
              issuer: demo
              subject: user-002
            startAt: 2026-11-09T13:00:00Z
            endAt: 2026-11-09T13:30:00Z
            status: confirmed
            attributes: {}
            cancellationNoticeSeconds: 7200
            cancellationDeadline: 2026-11-09T11:00:00Z
            version: 1
            createdAt: 2026-11-04T12:00:00Z
            updatedAt: 2026-11-04T12:00:00Z
        nextCursor: null
    CreateRequest:
      summary: Reserva genérica sin datos específicos de contexto.
      value:
        resourceId: 00000000-0000-4000-8000-100000000001
        startAt: 2026-11-10T19:00:00-03:00
        endAt: 2026-11-10T20:00:00-03:00
        attributes: {}
    UpdateRequest:
      summary: Reprogramación solicitada con versión esperada.
      value:
        expectedVersion: 1
        startAt: 2026-11-10T20:00:00-03:00
        endAt: 2026-11-10T21:00:00-03:00
        attributes: {}
    ConfirmedReservation:
      summary: Confirmación prefijada; no se almacena ni envía correo real.
      value:
        id: 00000000-0000-4000-8000-200000000001
        resourceId: 00000000-0000-4000-8000-100000000001
        responsible:
          issuer: demo
          subject: user-001
        startAt: 2026-11-10T22:00:00Z
        endAt: 2026-11-10T23:00:00Z
        status: confirmed
        attributes: {}
        cancellationNoticeSeconds: 7200
        cancellationDeadline: 2026-11-10T20:00:00Z
        version: 1
        createdAt: 2026-11-04T12:00:00Z
        updatedAt: 2026-11-04T12:00:00Z
    UpdatedReservation:
      summary: Resultado prefijado de una modificación, no un cambio persistido.
      value:
        id: 00000000-0000-4000-8000-200000000001
        resourceId: 00000000-0000-4000-8000-100000000001
        responsible:
          issuer: demo
          subject: user-001
        startAt: 2026-11-10T23:00:00Z
        endAt: 2026-11-11T00:00:00Z
        status: confirmed
        attributes: {}
        cancellationNoticeSeconds: 7200
        cancellationDeadline: 2026-11-10T21:00:00Z
        version: 2
        createdAt: 2026-11-04T12:00:00Z
        updatedAt: 2026-11-04T12:05:00Z
    CancelledReservation:
      summary: Resultado prefijado de cancelación; también ilustra un reintento.
      value:
        id: 00000000-0000-4000-8000-200000000001
        resourceId: 00000000-0000-4000-8000-100000000001
        responsible:
          issuer: demo
          subject: user-001
        startAt: 2026-11-10T22:00:00Z
        endAt: 2026-11-10T23:00:00Z
        status: cancelled
        attributes: {}
        cancellationNoticeSeconds: 7200
        cancellationDeadline: 2026-11-10T20:00:00Z
        version: 2
        createdAt: 2026-11-04T12:00:00Z
        updatedAt: 2026-11-04T12:05:00Z
    ReservationPage:
      summary: Página ilustrativa de reservas propias.
      value:
        items:
          - id: 00000000-0000-4000-8000-200000000001
            resourceId: 00000000-0000-4000-8000-100000000001
            responsible:
              issuer: demo
              subject: user-001
            startAt: 2026-11-10T22:00:00Z
            endAt: 2026-11-10T23:00:00Z
            status: confirmed
            attributes: {}
            cancellationNoticeSeconds: 7200
            cancellationDeadline: 2026-11-10T20:00:00Z
            version: 1
            createdAt: 2026-11-04T12:00:00Z
            updatedAt: 2026-11-04T12:00:00Z
        nextCursor: null
    ResourcePage:
      summary: Catálogo genérico ilustrativo para el selector.
      value:
        items:
          - id: 00000000-0000-4000-8000-100000000001
            name: Recurso 1
            enabled: true
            timeZone: America/Santiago
            attributes: {}
          - id: 00000000-0000-4000-8000-100000000002
            name: Recurso 2
            enabled: true
            timeZone: America/Santiago
            attributes: {}
        nextCursor: null
    Availability:
      summary: Ventanas libres estáticas; no se calcula ocupación.
      value:
        resourceId: 00000000-0000-4000-8000-100000000001
        enabled: true
        timeZone: America/Santiago
        from: 2026-11-10T21:00:00Z
        to: 2026-11-11T01:00:00Z
        slotDurationSeconds: 3600
        availableSlots:
          - startAt: 2026-11-10T21:00:00Z
            endAt: 2026-11-10T22:00:00Z
          - startAt: 2026-11-10T23:00:00Z
            endAt: 2026-11-11T00:00:00Z
          - startAt: 2026-11-11T00:00:00Z
            endAt: 2026-11-11T01:00:00Z
        availableWindows:
          - startAt: 2026-11-10T21:00:00Z
            endAt: 2026-11-10T22:00:00Z
          - startAt: 2026-11-10T23:00:00Z
            endAt: 2026-11-11T01:00:00Z
    NoAvailability:
      summary: Recurso habilitado sin ventanas libres en el rango ilustrativo.
      value:
        resourceId: 00000000-0000-4000-8000-100000000001
        enabled: true
        timeZone: America/Santiago
        from: 2026-11-10T21:00:00Z
        to: 2026-11-11T01:00:00Z
        slotDurationSeconds: 3600
        availableSlots: []
        availableWindows: []
    DisabledAvailability:
      summary: Recurso visible deshabilitado, sin ventanas libres.
      value:
        resourceId: 00000000-0000-4000-8000-100000000003
        enabled: false
        timeZone: America/Santiago
        from: 2026-11-10T21:00:00Z
        to: 2026-11-11T01:00:00Z
        slotDurationSeconds: 3600
        availableSlots: []
        availableWindows: []
    InvalidRequest:
      summary: Formato o campo no admitido.
      value:
        error:
          code: INVALID_REQUEST
          message: La solicitud contiene un campo no admitido.
          requestId: request-demo-001
          details:
            - field: responsible
              code: FIELD_NOT_ALLOWED
    Unauthenticated:
      summary: Sin identidad autenticada válida.
      value:
        error:
          code: UNAUTHENTICATED
          message: Se requiere autenticación.
          requestId: request-demo-001
    Forbidden:
      summary: Acceso general no autorizado.
      value:
        error:
          code: FORBIDDEN
          message: Operación no autorizada.
          requestId: request-demo-001
    ReservationNotFound:
      summary: No revela si la reserva existe para otro usuario.
      value:
        error:
          code: RESERVATION_NOT_FOUND
          message: Reserva no encontrada.
          requestId: request-demo-001
    ResourceNotFound:
      summary: Recurso inexistente o no visible.
      value:
        error:
          code: RESOURCE_NOT_FOUND
          message: Recurso no encontrado.
          requestId: request-demo-001
    VersionConflict:
      summary: Una escritura anterior cambió la versión.
      value:
        error:
          code: RESERVATION_VERSION_CONFLICT
          message: Consulta la versión actual antes de continuar.
          requestId: request-demo-001
    ResourceUnavailable:
      summary: Escenario de colisión sin datos de otras reservas.
      value:
        error:
          code: RESOURCE_UNAVAILABLE
          message: El recurso no está disponible en ese intervalo.
          requestId: request-demo-001
    ResourceBlocked:
      summary: Escenario de bloqueo con el mismo error público de indisponibilidad.
      value:
        error:
          code: RESOURCE_UNAVAILABLE
          message: El recurso no está disponible en ese intervalo.
          requestId: request-demo-001
    StateConflict:
      summary: La reserva cancelada no admite modificación.
      value:
        error:
          code: RESERVATION_STATE_CONFLICT
          message: El estado de la reserva no permite esta operación.
          requestId: request-demo-001
    IdempotencyConflict:
      summary: Clave repetida con otro contenido.
      value:
        error:
          code: IDEMPOTENCY_KEY_CONFLICT
          message: La clave ya se utilizó con otra solicitud.
          requestId: request-demo-001
    InvalidInterval:
      summary: Intervalo no permitido.
      value:
        error:
          code: INVALID_INTERVAL
          message: El inicio debe ser anterior al término.
          requestId: request-demo-001
    AlreadyStarted:
      summary: La reserva ya comenzó.
      value:
        error:
          code: RESERVATION_ALREADY_STARTED
          message: La reserva ya comenzó.
          requestId: request-demo-001
    CancellationWindowClosed:
      summary: Límite original vencido; no se libera ni cancela la reserva.
      value:
        error:
          code: CANCELLATION_WINDOW_CLOSED
          message: El plazo para cancelar o reprogramar venció.
          requestId: request-demo-001
    PolicyViolation:
      summary: Restricción del recurso incumplida.
      value:
        error:
          code: POLICY_VIOLATION
          message: El intervalo no cumple la política del recurso.
          requestId: request-demo-001
    InvalidAttributes:
      summary: Atributos ajenos al esquema del contexto.
      value:
        error:
          code: ATTRIBUTES_INVALID
          message: Los atributos no cumplen el esquema del contexto.
          requestId: request-demo-001
    InternalError:
      summary: Fallo genérico sin información interna.
      value:
        error:
          code: INTERNAL_ERROR
          message: No se pudo completar la operación.
          requestId: request-demo-001
    ServiceUnavailable:
      summary: Indisponibilidad temporal, no un conflicto de negocio.
      value:
        error:
          code: SERVICE_UNAVAILABLE
          message: Servicio temporalmente no disponible.
          requestId: request-demo-001
    CreateResourceRequest:
      summary: Alta de recurso en el ámbito con política y horario base.
      value:
        name: Recurso 1
        enabled: true
        timeZone: America/Santiago
        externalReference:
          system: catalogo-institucional
          id: cat-rec-001
        policy:
          cancellationNoticeSeconds: 7200
          minDurationSeconds: 3600
          maxDurationSeconds: 7200
          slotDurationSeconds: 3600
        weeklySchedule:
          - dayOfWeek: 1
            startLocalTime: 08:00
            endLocalTime: 22:00
          - dayOfWeek: 2
            startLocalTime: 08:00
            endLocalTime: 22:00
        attributes: {}
    UpdateResourceRequest:
      summary: Actualización administrativa de estado o política con versión esperada.
      value:
        expectedVersion: 1
        name: Recurso 1 - Sector Norte
        enabled: true
        policy:
          cancellationNoticeSeconds: 14400
          minDurationSeconds: 3600
          maxDurationSeconds: 7200
          slotDurationSeconds: 3600
    UpdateResourceScheduleRequest:
      summary: Reemplazo de horario semanal recurrente y límites de duración.
      value:
        expectedVersion: 1
        policy:
          cancellationNoticeSeconds: 7200
          minDurationSeconds: 3600
          maxDurationSeconds: 7200
          slotDurationSeconds: 3600
        weeklySchedule:
          - dayOfWeek: 1
            startLocalTime: 09:00
            endLocalTime: 21:00
          - dayOfWeek: 2
            startLocalTime: 09:00
            endLocalTime: 21:00
    CreateResourceClosureRequest:
      summary: Solicitud de cierre o mantenimiento programado.
      value:
        startAt: 2026-11-12T15:00:00Z
        endAt: 2026-11-12T18:00:00Z
        reason: Mantenimiento preventivo de instalaciones
    ResourceDetail:
      summary: Configuración administrativa completa del recurso.
      value:
        id: 00000000-0000-4000-8000-100000000001
        name: Recurso 1
        enabled: true
        timeZone: America/Santiago
        externalReference:
          system: catalogo-institucional
          id: cat-rec-001
        policy:
          cancellationNoticeSeconds: 7200
          minDurationSeconds: 3600
          maxDurationSeconds: 7200
          slotDurationSeconds: 3600
        weeklySchedule:
          - dayOfWeek: 1
            startLocalTime: 08:00
            endLocalTime: 22:00
          - dayOfWeek: 2
            startLocalTime: 08:00
            endLocalTime: 22:00
        closures:
          - id: 00000000-0000-4000-8000-300000000001
            resourceId: 00000000-0000-4000-8000-100000000001
            startAt: 2026-11-12T15:00:00Z
            endAt: 2026-11-12T18:00:00Z
            reason: Mantenimiento preventivo de instalaciones
            createdAt: 2026-11-04T12:00:00Z
        attributes: {}
        version: 1
        createdAt: 2026-11-01T10:00:00Z
        updatedAt: 2026-11-04T12:00:00Z
    UpdatedResourceDetail:
      summary: Recurso actualizado con versión incrementada.
      value:
        id: 00000000-0000-4000-8000-100000000001
        name: Recurso 1 - Sector Norte
        enabled: true
        timeZone: America/Santiago
        externalReference:
          system: catalogo-institucional
          id: cat-rec-001
        policy:
          cancellationNoticeSeconds: 14400
          minDurationSeconds: 3600
          maxDurationSeconds: 7200
          slotDurationSeconds: 3600
        weeklySchedule:
          - dayOfWeek: 1
            startLocalTime: 09:00
            endLocalTime: 21:00
          - dayOfWeek: 2
            startLocalTime: 09:00
            endLocalTime: 21:00
        closures:
          - id: 00000000-0000-4000-8000-300000000001
            resourceId: 00000000-0000-4000-8000-100000000001
            startAt: 2026-11-12T15:00:00Z
            endAt: 2026-11-12T18:00:00Z
            reason: Mantenimiento preventivo de instalaciones
            createdAt: 2026-11-04T12:00:00Z
        attributes: {}
        version: 2
        createdAt: 2026-11-01T10:00:00Z
        updatedAt: 2026-11-04T12:10:00Z
    ResourceClosure:
      summary: Bloqueo temporal registrado sobre el recurso.
      value:
        id: 00000000-0000-4000-8000-300000000001
        resourceId: 00000000-0000-4000-8000-100000000001
        startAt: 2026-11-12T15:00:00Z
        endAt: 2026-11-12T18:00:00Z
        reason: Mantenimiento preventivo de instalaciones
        createdAt: 2026-11-04T12:00:00Z
    ResourceVersionConflict:
      summary: La versión esperada del recurso no coincide con la vigente.
      value:
        error:
          code: RESOURCE_VERSION_CONFLICT
          message: El recurso fue modificado por otra operación; consulta su versión actual.
          requestId: request-demo-001
    ResourceScheduleConflict:
      summary: Rechazo por conflicto con reservas confirmadas existentes (REQ-012, AC-021).
      value:
        error:
          code: RESOURCE_SCHEDULE_CONFLICT
          message: El cambio de disponibilidad o bloqueo afecta reservas confirmadas vigentes.
          requestId: request-demo-001
          details:
            - field: 00000000-0000-4000-8000-200000000001
              code: CONFIRMED_RESERVATION_OVERLAP
    ClosureNotFound:
      summary: Bloqueo inexistente en el recurso.
      value:
        error:
          code: CLOSURE_NOT_FOUND
          message: Bloqueo no encontrado para este recurso.
          requestId: request-demo-001
  parameters:
    ClosureId:
      description: UUID de un bloqueo temporal del recurso.
      example: 00000000-0000-4000-8000-300000000001
      in: path
      name: closureId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    Cursor:
      description: |
        Continuación opaca de la misma consulta, identidad y ámbito. No concede
        acceso ni promete una fotografía inmutable de páginas concurrentes.
      in: query
      name: cursor
      schema:
        maxLength: 2048
        minLength: 1
        pattern: \S
        type: string
    IdempotencyKey:
      description: Identifica reintentos de la misma creación; no concede autorización.
      example: demo-create-001
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        minLength: 1
        pattern: \S
        type: string
    Limit:
      description: Elementos por página; no se recortan silenciosamente valores inválidos.
      in: query
      name: limit
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    MockScenario:
      description: Solo para el Hito 1. Selecciona una respuesta simulada; no es parte de la autorización ni una función productiva. Escenarios incompatibles con una escritura devuelven 400. Usar demo-admin en Authorize para las operaciones administrativas.
      in: header
      name: X-Mock-Scenario
      required: false
      schema:
        default: normal
        enum:
          - normal
          - success
          - empty
          - paginated
          - cancelled
          - expired
          - started
          - notFound
          - disabled
          - conflict
          - version
          - deadline
          - policy
          - error
          - unauthorized
          - forbidden
        type: string
    OptionalFrom:
      description: Inicio inclusivo del filtro de solapamiento; requiere también to.
      example: 2026-11-01T00:00:00Z
      in: query
      name: from
      schema:
        $ref: '#/components/schemas/DateTime'
    OptionalTo:
      description: Término exclusivo del filtro de solapamiento; requiere también from.
      example: 2026-12-01T00:00:00Z
      in: query
      name: to
      schema:
        $ref: '#/components/schemas/DateTime'
    ReservationId:
      description: UUID de una reserva propia del ámbito autenticado.
      example: 00000000-0000-4000-8000-200000000001
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ResourceFilter:
      description: Filtrar por recurso dentro del alcance personal o administrativo autorizado del endpoint.
      in: query
      name: resourceId
      schema:
        $ref: '#/components/schemas/Identifier'
    ResourceId:
      description: UUID de un recurso visible.
      example: 00000000-0000-4000-8000-100000000001
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    StatusFilter:
      description: Omitido incluye ambos estados.
      in: query
      name: status
      schema:
        $ref: '#/components/schemas/ReservationStatus'
  responses:
    BadRequest:
      content:
        application/json:
          examples:
            invalidRequest:
              $ref: '#/components/examples/InvalidRequest'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Forma, parámetro, campo, cabecera o cursor no admitido.
    Forbidden:
      content:
        application/json:
          examples:
            forbidden:
              $ref: '#/components/examples/Forbidden'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Acceso general a la operación no autorizado, sin revelar entidades ajenas.
    InternalError:
      content:
        application/json:
          examples:
            internalError:
              $ref: '#/components/examples/InternalError'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Fallo no previsto, sin detalles internos ni datos sensibles.
    InvalidCreation:
      content:
        application/json:
          examples:
            invalidAttributes:
              $ref: '#/components/examples/InvalidAttributes'
            invalidInterval:
              $ref: '#/components/examples/InvalidInterval'
            policyViolation:
              $ref: '#/components/examples/PolicyViolation'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Intervalo, política o atributos de la nueva reserva no válidos.
    InvalidModification:
      content:
        application/json:
          examples:
            alreadyStarted:
              $ref: '#/components/examples/AlreadyStarted'
            deadlineExpired:
              $ref: '#/components/examples/CancellationWindowClosed'
            invalidAttributes:
              $ref: '#/components/examples/InvalidAttributes'
            invalidInterval:
              $ref: '#/components/examples/InvalidInterval'
            policyViolation:
              $ref: '#/components/examples/PolicyViolation'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Intervalo inválido, inicio alcanzado, plazo vencido o política incumplida.
    ReservationNotFound:
      content:
        application/json:
          examples:
            reservationNotFound:
              $ref: '#/components/examples/ReservationNotFound'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Reserva inexistente, ajena o de otro ámbito, sin distinguir los casos.
    ReservationOrResourceNotFound:
      content:
        application/json:
          examples:
            reservationNotFound:
              $ref: '#/components/examples/ReservationNotFound'
            resourceNotFound:
              $ref: '#/components/examples/ResourceNotFound'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Reserva propia o recurso resultante no encontrado o no accesible.
    ResourceNotFound:
      content:
        application/json:
          examples:
            resourceNotFound:
              $ref: '#/components/examples/ResourceNotFound'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Recurso inexistente o no visible para el solicitante.
    Unauthorized:
      content:
        application/json:
          examples:
            unauthenticated:
              $ref: '#/components/examples/Unauthenticated'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: No existe identidad autenticada válida.
    Unavailable:
      content:
        application/json:
          examples:
            serviceUnavailable:
              $ref: '#/components/examples/ServiceUnavailable'
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Servicio temporalmente incapaz de completar la operación.
  schemas:
    Attributes:
      additionalProperties: false
      description: |
        Objeto genérico vacío. Cada adaptación deberá definir explícitamente sus
        campos, tipos y validaciones antes de admitir claves adicionales. No
        puede cambiar identidad, ámbito, permisos, ocupación ni políticas.
      example: {}
      type: object
    Availability:
      additionalProperties: false
      properties:
        availableSlots:
          description: Bloques completos reservables, alineados al inicio de cada franja semanal, dentro del rango y futuros. Excluyen solapamientos con reservas confirmadas y bloqueos. Un remanente menor a la duración no genera un bloque. No retienen disponibilidad.
          items:
            $ref: '#/components/schemas/AvailableWindow'
          type: array
        availableWindows:
          description: Ventanas continuas libres; no turnos fijos ni reservas retenidas.
          items:
            $ref: '#/components/schemas/AvailableWindow'
          type: array
        enabled:
          type: boolean
        from:
          $ref: '#/components/schemas/DateTime'
        resourceId:
          $ref: '#/components/schemas/Identifier'
        slotDurationSeconds:
          description: Duración fija configurada del recurso. El usuario selecciona un bloque completo, sin escribir inicio ni término.
          maximum: 9007199254740991
          minimum: 60
          multipleOf: 60
          type: integer
        timeZone:
          example: America/Santiago
          maxLength: 64
          minLength: 1
          pattern: \S
          type: string
        to:
          $ref: '#/components/schemas/DateTime'
      required:
        - resourceId
        - enabled
        - timeZone
        - from
        - to
        - availableWindows
        - availableSlots
        - slotDurationSeconds
      type: object
    AvailableWindow:
      additionalProperties: false
      properties:
        endAt:
          $ref: '#/components/schemas/DateTime'
        startAt:
          $ref: '#/components/schemas/DateTime'
      required:
        - startAt
        - endAt
      type: object
    CancelReservationRequest:
      additionalProperties: false
      properties:
        expectedVersion:
          description: Precondición para una transición nueva; un reintento ya cancelado no repite efectos.
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - expectedVersion
      type: object
    CancelledReservation:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - properties:
            status:
              enum:
                - cancelled
              type: string
          type: object
    ConfirmedReservation:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - properties:
            status:
              enum:
                - confirmed
              type: string
          type: object
    CreateReservationRequest:
      additionalProperties: false
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        endAt:
          $ref: '#/components/schemas/DateTime'
        resourceId:
          $ref: '#/components/schemas/Identifier'
        startAt:
          $ref: '#/components/schemas/DateTime'
      required:
        - resourceId
        - startAt
        - endAt
      type: object
    CreateResourceClosureRequest:
      additionalProperties: false
      properties:
        endAt:
          $ref: '#/components/schemas/DateTime'
        reason:
          maxLength: 500
          minLength: 1
          pattern: \S
          type: string
        startAt:
          $ref: '#/components/schemas/DateTime'
      required:
        - reason
        - startAt
        - endAt
      type: object
    CreateResourceRequest:
      additionalProperties: false
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        enabled:
          type: boolean
        externalReference:
          $ref: '#/components/schemas/ExternalReference'
        name:
          maxLength: 128
          minLength: 1
          pattern: \S
          type: string
        policy:
          $ref: '#/components/schemas/ResourcePolicy'
        timeZone:
          example: America/Santiago
          maxLength: 64
          minLength: 1
          pattern: \S
          type: string
        weeklySchedule:
          items:
            $ref: '#/components/schemas/WeeklyScheduleRule'
          maxItems: 100
          type: array
      required:
        - name
        - enabled
        - timeZone
        - policy
      type: object
    DateTime:
      description: Instante RFC 3339 con desplazamiento explícito o Z; respuestas en UTC.
      example: 2026-11-10T22:00:00Z
      format: date-time
      type: string
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - INVALID_REQUEST
                - UNAUTHENTICATED
                - FORBIDDEN
                - RESERVATION_NOT_FOUND
                - RESOURCE_NOT_FOUND
                - CLOSURE_NOT_FOUND
                - RESERVATION_VERSION_CONFLICT
                - RESOURCE_VERSION_CONFLICT
                - RESOURCE_SCHEDULE_CONFLICT
                - RESOURCE_UNAVAILABLE
                - RESERVATION_STATE_CONFLICT
                - IDEMPOTENCY_KEY_CONFLICT
                - INVALID_INTERVAL
                - RESERVATION_ALREADY_STARTED
                - CANCELLATION_WINDOW_CLOSED
                - POLICY_VIOLATION
                - ATTRIBUTES_INVALID
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
              type: string
            details:
              items:
                additionalProperties: false
                properties:
                  code:
                    minLength: 1
                    type: string
                  field:
                    minLength: 1
                    type: string
                required:
                  - field
                  - code
                type: object
              type: array
            message:
              description: Texto público; el cliente decide por code, no por este texto.
              minLength: 1
              type: string
            requestId:
              minLength: 1
              type: string
          required:
            - code
            - message
            - requestId
          type: object
      required:
        - error
      type: object
    ExternalReference:
      additionalProperties: false
      description: Vínculo opcional con el catálogo maestro externo del negocio.
      properties:
        id:
          example: cat-rec-001
          maxLength: 128
          minLength: 1
          pattern: \S
          type: string
        system:
          example: catalogo-institucional
          maxLength: 128
          minLength: 1
          pattern: \S
          type: string
      required:
        - system
        - id
      type: object
    Identifier:
      description: Identificador UUID de un registro de BookingMS.
      format: uuid
      pattern: ^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$
      type: string
    IdentityReference:
      additionalProperties: false
      properties:
        issuer:
          description: Emisor externo de la identidad.
          minLength: 1
          type: string
        subject:
          description: Identificador de la identidad dentro del emisor.
          minLength: 1
          type: string
      required:
        - issuer
        - subject
      type: object
    Reservation:
      additionalProperties: false
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        cancellationDeadline:
          $ref: '#/components/schemas/DateTime'
        cancellationNoticeSeconds:
          description: Duración original aceptada, inmutable; no procede del cliente.
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        createdAt:
          $ref: '#/components/schemas/DateTime'
        endAt:
          $ref: '#/components/schemas/DateTime'
        id:
          $ref: '#/components/schemas/Identifier'
        resourceId:
          $ref: '#/components/schemas/Identifier'
        responsible:
          $ref: '#/components/schemas/IdentityReference'
        startAt:
          $ref: '#/components/schemas/DateTime'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - id
        - resourceId
        - responsible
        - status
        - attributes
        - cancellationNoticeSeconds
        - cancellationDeadline
        - version
        - createdAt
        - updatedAt
        - startAt
        - endAt
      type: object
    ReservationPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Reservation'
          maxItems: 100
          type: array
        nextCursor:
          description: null cuando no hay más resultados.
          minLength: 1
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ReservationStatus:
      description: El paso del tiempo no cancela automáticamente una reserva.
      enum:
        - confirmed
        - cancelled
      type: string
    Resource:
      additionalProperties: false
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        enabled:
          type: boolean
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          maxLength: 128
          minLength: 1
          pattern: \S
          type: string
        timeZone:
          description: Nombre de zona IANA para presentación y horarios del recurso.
          example: America/Santiago
          maxLength: 64
          minLength: 1
          pattern: \S
          type: string
      required:
        - id
        - name
        - enabled
        - timeZone
        - attributes
      type: object
    ResourceClosure:
      additionalProperties: false
      description: Intervalo excepcional de bloqueo o mantenimiento sobre un recurso.
      properties:
        createdAt:
          $ref: '#/components/schemas/DateTime'
        endAt:
          $ref: '#/components/schemas/DateTime'
        id:
          $ref: '#/components/schemas/Identifier'
        reason:
          example: Mantenimiento preventivo de iluminación
          maxLength: 500
          minLength: 1
          pattern: \S
          type: string
        resourceId:
          $ref: '#/components/schemas/Identifier'
        startAt:
          $ref: '#/components/schemas/DateTime'
      required:
        - id
        - resourceId
        - reason
        - createdAt
        - startAt
        - endAt
      type: object
    ResourceDetail:
      additionalProperties: false
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        closures:
          items:
            $ref: '#/components/schemas/ResourceClosure'
          type: array
        createdAt:
          $ref: '#/components/schemas/DateTime'
        enabled:
          type: boolean
        externalReference:
          $ref: '#/components/schemas/ExternalReference'
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          maxLength: 128
          minLength: 1
          pattern: \S
          type: string
        policy:
          $ref: '#/components/schemas/ResourcePolicy'
        timeZone:
          example: America/Santiago
          maxLength: 64
          minLength: 1
          pattern: \S
          type: string
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        weeklySchedule:
          items:
            $ref: '#/components/schemas/WeeklyScheduleRule'
          maxItems: 100
          type: array
      required:
        - policy
        - weeklySchedule
        - closures
        - version
        - createdAt
        - updatedAt
        - id
        - name
        - enabled
        - timeZone
        - attributes
      type: object
    ResourcePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Resource'
          maxItems: 100
          type: array
        nextCursor:
          description: null cuando no hay más resultados.
          minLength: 1
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ResourcePolicy:
      additionalProperties: false
      description: Política temporal vigente para nuevas reservas sobre el recurso.
      properties:
        cancellationNoticeSeconds:
          description: Anticipación mínima L en segundos exigida para cancelar o reprogramar.
          example: 7200
          format: int64
          maximum: 9007199254740991
          minimum: 0
          type: integer
        maxDurationSeconds:
          description: Duración máxima permitida por reserva en segundos.
          example: 7200
          format: int64
          maximum: 9007199254740991
          minimum: 60
          type: integer
        minDurationSeconds:
          description: Duración mínima permitida por reserva en segundos.
          example: 3600
          format: int64
          maximum: 9007199254740991
          minimum: 60
          type: integer
        slotDurationSeconds:
          description: Duración fija de cada bloque reservable en segundos, en minutos enteros. Los bloques se alinean con el inicio de cada franja semanal; no se ofrecen bloques parciales. Debe estar dentro de los límites mínimo y máximo.
          example: 3600
          maximum: 9007199254740991
          minimum: 60
          multipleOf: 60
          type: integer
      required:
        - cancellationNoticeSeconds
        - minDurationSeconds
        - maxDurationSeconds
        - slotDurationSeconds
      type: object
    UpdateReservationRequest:
      additionalProperties: false
      description: Al menos un campo modificable además de la versión esperada; null no se admite.
      minProperties: 2
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        endAt:
          $ref: '#/components/schemas/DateTime'
        expectedVersion:
          description: Versión consultada por el cliente, no la nueva versión a persistir.
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        resourceId:
          $ref: '#/components/schemas/Identifier'
        startAt:
          $ref: '#/components/schemas/DateTime'
      required:
        - expectedVersion
      type: object
    UpdateResourceRequest:
      additionalProperties: false
      description: Al menos un campo modificable además de expectedVersion.
      minProperties: 2
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        enabled:
          type: boolean
        expectedVersion:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        externalReference:
          $ref: '#/components/schemas/ExternalReference'
        name:
          maxLength: 128
          minLength: 1
          pattern: \S
          type: string
        policy:
          $ref: '#/components/schemas/ResourcePolicy'
        timeZone:
          maxLength: 64
          minLength: 1
          pattern: \S
          type: string
      required:
        - expectedVersion
      type: object
    UpdateResourceScheduleRequest:
      additionalProperties: false
      properties:
        expectedVersion:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        policy:
          $ref: '#/components/schemas/ResourcePolicy'
        weeklySchedule:
          items:
            $ref: '#/components/schemas/WeeklyScheduleRule'
          maxItems: 100
          type: array
      required:
        - expectedVersion
        - policy
        - weeklySchedule
      type: object
    WeeklyScheduleRule:
      additionalProperties: false
      description: Franja horaria recurrente interpretada en la zona IANA del recurso.
      properties:
        dayOfWeek:
          description: Día ISO-8601 (1 = Lunes, 7 = Domingo).
          example: 1
          maximum: 7
          minimum: 1
          type: integer
        endLocalTime:
          description: Hora local de cierre en formato HH:MM.
          example: "22:00"
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          type: string
        startLocalTime:
          description: Hora local de apertura en formato HH:MM.
          example: "08:00"
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          type: string
      required:
        - dayOfWeek
        - startLocalTime
        - endLocalTime
      type: object
  securitySchemes:
    BearerAuth:
      description: |
        Autenticación HTTP entre servicios. En el mock dev se admiten demo-user
        y demo-admin. El navegador usa la cookie de sesión emitida por Usuarios
        y Roles. Su nombre se configura en Agenda con AUTH_COOKIE_NAME según
        el contrato de ese servicio.
      scheme: bearer
      type: http
info:
  contact:
    name: Equipo LPS
  description: |
    Contrato inicial para documentación y respuestas simuladas. No representa
    lógica real, persistencia de reservas en PostgreSQL ni autenticación de producción.

    El responsable y el ámbito proceden de la identidad autenticada; cada usuario
    gestiona solo sus propias reservas. El cuerpo no permite sustituirlos.
    El mecanismo de identidad de producción se definirá en el siguiente hito.

    Las reglas descritas son obligaciones de la futura implementación. Los
    ejemplos son escenarios prefijados: no calculan colisiones, no actualizan
    estado y no garantizan coherencia entre peticiones independientes.
    Las fechas ilustrativas no se desplazan con el reloj ni constituyen políticas
    universales. En esta fase no hay llamadas a G10 ni correos reales.

    Los intervalos son [inicio, fin). Las fechas de entrada llevan zona explícita
    y las respuestas usan UTC. Las condiciones de cancelación originales se
    conservan incluso al modificar horario o recurso. Vencido el límite, la
    reserva sigue confirmada y mantiene su ocupación, sin poder cancelarse ni
    cambiar horario o recurso. Estas comparaciones requieren lógica posterior;
    no quedan demostradas por validar este archivo.
  title: API genérica de reservas LPS
  version: 0.4.0
openapi: 3.1.0
paths:
  /api/v1/admin/reservas:
    get:
      description: |
        Requiere administrador de ámbito. Incluye reservas confirmadas y
        canceladas de todos los responsables del ámbito derivado de la identidad.
        No acepta otro ámbito ni permite ampliar el acceso desde un filtro.
        Mantiene orden startAt e id ascendentes, filtros por recurso, estado y
        solapamiento, y paginación por cursor. No habilita crear para terceros,
        modificar ni cancelar sus reservas. El mock requiere demo-admin.
      operationId: listAdminReservations
      parameters:
        - $ref: '#/components/parameters/ResourceFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/OptionalFrom'
        - $ref: '#/components/parameters/OptionalTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              examples:
                empty:
                  value:
                    items: []
                    nextCursor: null
                reservations:
                  $ref: '#/components/examples/AdminReservationPage'
              schema:
                $ref: '#/components/schemas/ReservationPage'
          description: Página de reservas del ámbito, con la referencia de identidad de cada responsable; vacío no es un error.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Listar reservas de todos los usuarios del ámbito administrado
      tags:
        - Administración de Reservas
      x-permission: reservas:administrar
    parameters:
      - $ref: '#/components/parameters/MockScenario'
  /api/v1/recursos:
    get:
      description: |
        Catálogo visible del ámbito autenticado, ordenado por id ascendente.
        enabled por defecto true alimenta el selector de recursos habilitados;
        false selecciona deshabilitados visibles. Estar habilitado no garantiza
        disponibilidad de un intervalo. No admite filtros arbitrarios de atributos.
      operationId: listResources
      parameters:
        - description: Filtra por habilitación, sin ampliar la autorización.
          in: query
          name: enabled
          schema:
            default: true
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              examples:
                empty:
                  value:
                    items: []
                    nextCursor: null
                resources:
                  $ref: '#/components/examples/ResourcePage'
              schema:
                $ref: '#/components/schemas/ResourcePage'
          description: Página de recursos visibles o lista vacía.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Listar recursos visibles
      tags:
        - Recursos
      x-permission: recursos:leer
    parameters:
      - $ref: '#/components/parameters/MockScenario'
    post:
      description: |
        Registra un nuevo recurso exclusivo dentro del ámbito autorizado del
        administrador. Define nombre visible, habilitación inicial, zona horaria
        IANA, referencia opcional a un catálogo externo, política inicial y
        atributos del recurso. En la fase de mocks devuelve un ejemplo prefijado.
      operationId: createResource
      requestBody:
        content:
          application/json:
            examples:
              createResource:
                $ref: '#/components/examples/CreateResourceRequest'
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                created:
                  $ref: '#/components/examples/ResourceDetail'
              schema:
                $ref: '#/components/schemas/ResourceDetail'
          description: Recurso creado; en el mock devuelve una respuesta simulada.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          content:
            application/json:
              examples:
                invalidAttributes:
                  $ref: '#/components/examples/InvalidAttributes'
                policyViolation:
                  $ref: '#/components/examples/PolicyViolation'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Política o atributos del recurso no válidos.
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Crear un recurso reservable en el ámbito
      tags:
        - Administración de Recursos
      x-permission: recursos:administrar
  /api/v1/recursos/{id}:
    get:
      description: |
        Devuelve la configuración completa de un recurso del ámbito, incluyendo
        su versión vigente, referencia a catálogo externo, política de tiempo y
        cancelación, horario semanal recurrente y bloqueos activos.
      operationId: getResource
      responses:
        "200":
          content:
            application/json:
              examples:
                detail:
                  $ref: '#/components/examples/ResourceDetail'
              schema:
                $ref: '#/components/schemas/ResourceDetail'
          description: Detalle administrativo del recurso.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceNotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Consultar detalle administrativo de un recurso
      tags:
        - Administración de Recursos
      x-permission: recursos:administrar
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ResourceId'
    patch:
      description: |
        Actualiza parcialmente nombre, habilitación (enabled), zona horaria,
        referencia externa, política o atributos del recurso exigiendo
        expectedVersion. Cambiar cancellationNoticeSeconds rige únicamente para
        nuevas reservas y no altera el plazo original aceptado por reservas ya
        confirmadas (REQ-031). Si se intenta deshabilitar un recurso que posee
        reservas futuras confirmadas, se rechaza íntegramente con 409 (REQ-012).
      operationId: updateResource
      requestBody:
        content:
          application/json:
            examples:
              updatePolicyAndState:
                $ref: '#/components/examples/UpdateResourceRequest'
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                updated:
                  $ref: '#/components/examples/UpdatedResourceDetail'
              schema:
                $ref: '#/components/schemas/ResourceDetail'
          description: Recurso actualizado con versión incrementada.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceNotFound'
        "409":
          content:
            application/json:
              examples:
                scheduleConflict:
                  $ref: '#/components/examples/ResourceScheduleConflict'
                versionConflict:
                  $ref: '#/components/examples/ResourceVersionConflict'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Versión desactualizada del recurso o conflicto con reservas confirmadas al deshabilitar.
        "422":
          content:
            application/json:
              examples:
                invalidAttributes:
                  $ref: '#/components/examples/InvalidAttributes'
                policyViolation:
                  $ref: '#/components/examples/PolicyViolation'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Política o atributos del recurso no válidos.
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Modificar estado, política o metadatos de un recurso
      tags:
        - Administración de Recursos
      x-permission: recursos:administrar
  /api/v1/recursos/{id}/bloqueos:
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ResourceId'
    post:
      description: |
        Registra un intervalo semiabierto [startAt, endAt) de indisponibilidad
        por mantenimiento o cierre administrativo. Si el bloqueo se solapa con
        una reserva confirmada vigente en ese recurso, se rechaza con 409
        RESOURCE_SCHEDULE_CONFLICT para que el actor autorizado resuelva el
        conflicto antes de aplicar el cierre (REQ-012, AC-021).
      operationId: createResourceClosure
      requestBody:
        content:
          application/json:
            examples:
              maintenanceClosure:
                $ref: '#/components/examples/CreateResourceClosureRequest'
            schema:
              $ref: '#/components/schemas/CreateResourceClosureRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                createdClosure:
                  $ref: '#/components/examples/ResourceClosure'
              schema:
                $ref: '#/components/schemas/ResourceClosure'
          description: Bloqueo temporal registrado sobre el recurso.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceNotFound'
        "409":
          content:
            application/json:
              examples:
                scheduleConflict:
                  $ref: '#/components/examples/ResourceScheduleConflict'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El bloqueo propuesto entra en conflicto con reservas confirmadas existentes.
        "422":
          content:
            application/json:
              examples:
                invalidInterval:
                  $ref: '#/components/examples/InvalidInterval'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Intervalo de bloqueo inválido (startAt >= endAt).
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Registrar un bloqueo o cierre excepcional sobre un recurso
      tags:
        - Administración de Recursos
      x-permission: recursos:administrar
  /api/v1/recursos/{id}/bloqueos/{closureId}:
    delete:
      description: |
        Levanta un bloqueo excepcional previamente registrado sobre el recurso,
        restituyendo la disponibilidad gobernada por su horario recurrente.
      operationId: deleteResourceClosure
      responses:
        "204":
          description: Bloqueo eliminado correctamente.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              examples:
                closureNotFound:
                  $ref: '#/components/examples/ClosureNotFound'
                resourceNotFound:
                  $ref: '#/components/examples/ResourceNotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Recurso o bloqueo inexistente en el ámbito autorizado.
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Eliminar un bloqueo o cierre excepcional de un recurso
      tags:
        - Administración de Recursos
      x-permission: recursos:administrar
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ClosureId'
  /api/v1/recursos/{id}/disponibilidades:
    get:
      description: |
        Ventanas continuas libres ordenadas, sin solapamientos y dentro de
        [from, to). Exige ambos extremos y un máximo de 31 días por consulta.
        Ese máximo limita la carga del calendario, no la anticipación de reservas.
        La precisión temporal y el cómputo técnico del máximo en cambios de zona
        se cerrarán antes de implementar la lógica real.

        La futura implementación descuenta bloqueos y reservas confirmadas de
        todos los usuarios, sin exponer identidades ni motivos privados.
        availableWindows conserva las ventanas continuas y availableSlots
        ofrece bloques completos según slotDurationSeconds del recurso,
        alineados a cada apertura semanal y sin reservas ni bloqueos solapados.
        Ningún bloque garantiza disponibilidad para una creación posterior.
        Un recurso visible deshabilitado devuelve enabled=false y
        availableWindows vacío. Una consulta sin ventanas libres devuelve 200.
        No se permite excluir una reserva mediante parámetros en esta consulta.
        Los intervalos del mock son ejemplos estáticos, no cálculos reales.
      operationId: getResourceAvailability
      parameters:
        - description: Inicio inclusivo del rango, con zona explícita.
          example: 2026-11-10T21:00:00Z
          in: query
          name: from
          required: true
          schema:
            $ref: '#/components/schemas/DateTime'
        - description: Término exclusivo, posterior a from; máximo 31 días de rango.
          example: 2026-11-11T01:00:00Z
          in: query
          name: to
          required: true
          schema:
            $ref: '#/components/schemas/DateTime'
      responses:
        "200":
          content:
            application/json:
              examples:
                available:
                  $ref: '#/components/examples/Availability'
                disabledResource:
                  $ref: '#/components/examples/DisabledAvailability'
                noAvailability:
                  $ref: '#/components/examples/NoAvailability'
              schema:
                $ref: '#/components/schemas/Availability'
          description: Disponibilidad del rango solicitado, sin datos privados de otras reservas.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceNotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Consultar disponibilidad de un recurso
      tags:
        - Disponibilidad
      x-permission: recursos:leer
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ResourceId'
  /api/v1/recursos/{id}/horarios:
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ResourceId'
    put:
      description: |
        Reemplaza las franjas horarias recurrentes del recurso (interpretadas en
        la zona IANA del recurso) y su política de duración mínima/máxima,
        exigiendo expectedVersion. Si el nuevo horario deja fuera del rango
        habilitado alguna reserva futura confirmada, la operación se rechaza
        íntegramente con 409 RESOURCE_SCHEDULE_CONFLICT sin cancelar ni
        reubicar reservas silenciosamente (REQ-012, AC-021).
      operationId: updateResourceSchedule
      requestBody:
        content:
          application/json:
            examples:
              weeklySchedule:
                $ref: '#/components/examples/UpdateResourceScheduleRequest'
            schema:
              $ref: '#/components/schemas/UpdateResourceScheduleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                updated:
                  $ref: '#/components/examples/UpdatedResourceDetail'
              schema:
                $ref: '#/components/schemas/ResourceDetail'
          description: Horario y reglas temporales actualizados.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceNotFound'
        "409":
          content:
            application/json:
              examples:
                scheduleConflict:
                  $ref: '#/components/examples/ResourceScheduleConflict'
                versionConflict:
                  $ref: '#/components/examples/ResourceVersionConflict'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Versión desactualizada o conflicto del nuevo horario con reservas confirmadas.
        "422":
          content:
            application/json:
              examples:
                invalidInterval:
                  $ref: '#/components/examples/InvalidInterval'
                policyViolation:
                  $ref: '#/components/examples/PolicyViolation'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Reglas horarias o límites de duración inconsistentes.
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Configurar horario semanal recurrente y límites de duración
      tags:
        - Administración de Recursos
      x-permission: recursos:administrar
  /api/v1/reservas:
    get:
      description: |
        Solo devuelve reservas propias del ámbito autenticado. Sin status incluye
        confirmadas y canceladas. from y to deben enviarse juntos; el filtro
        selecciona solapamientos: startAt < to y endAt > from.
        Sin rango permite consultar el historial paginado. Orden: startAt e id
        ascendentes. El límite de 31 días de disponibilidad no limita este listado.
        Los ejemplos no ejecutan filtros ni paginación real.
      operationId: listReservations
      parameters:
        - $ref: '#/components/parameters/ResourceFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/OptionalFrom'
        - $ref: '#/components/parameters/OptionalTo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              examples:
                empty:
                  value:
                    items: []
                    nextCursor: null
                reservations:
                  $ref: '#/components/examples/ReservationPage'
              schema:
                $ref: '#/components/schemas/ReservationPage'
          description: Página de reservas propias; una búsqueda sin resultados no es un error.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Listar reservas propias
      tags:
        - Reservas
      x-permission: reservas:leer
    parameters:
      - $ref: '#/components/parameters/MockScenario'
    post:
      description: |
        Crea una reserva confirmada para el usuario autenticado. La futura
        implementación debe validar recurso, horarios, bloqueos, colisiones y
        políticas, y guardar atómicamente la ocupación y el plazo aceptado.
        Repetir Idempotency-Key y contenido devuelve el resultado original sin
        duplicar efectos. La retención y el alcance técnico de la clave quedan
        pendientes para el hito de lógica real; el mock solo muestra ejemplos.
      operationId: createReservation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - description: Identificador de correlación para el envío de la confirmación.
          in: header
          name: X-Request-Id
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              genericReservation:
                $ref: '#/components/examples/CreateRequest'
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                confirmed:
                  $ref: '#/components/examples/ConfirmedReservation'
              schema:
                $ref: '#/components/schemas/ConfirmedReservation'
          description: Reserva confirmada; en el mock es una respuesta prefijada sin escritura.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ResourceNotFound'
        "409":
          content:
            application/json:
              examples:
                blocked:
                  $ref: '#/components/examples/ResourceBlocked'
                collision:
                  $ref: '#/components/examples/ResourceUnavailable'
                idempotencyConflict:
                  $ref: '#/components/examples/IdempotencyConflict'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Colisión, bloqueo o misma clave de idempotencia con otro contenido.
        "422":
          $ref: '#/components/responses/InvalidCreation'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Crear una reserva personal
      tags:
        - Reservas
      x-permission: reservas:operar
  /api/v1/reservas/{id}:
    get:
      description: |
        Consulta una reserva confirmada o cancelada sin alterar estado ni versión.
        Una reserva inexistente, ajena o de otro ámbito produce el mismo 404.
        version permite construir expectedVersion en posteriores escrituras.
      operationId: getReservation
      responses:
        "200":
          content:
            application/json:
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelledReservation'
                confirmed:
                  $ref: '#/components/examples/ConfirmedReservation'
              schema:
                $ref: '#/components/schemas/Reservation'
          description: Representación vigente; el mock devuelve el ejemplo seleccionado.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ReservationNotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Consultar una reserva propia
      tags:
        - Reservas
      x-permission: reservas:leer
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ReservationId'
    patch:
      description: |
        Solicita un cambio parcial de horario, recurso o attributes de una reserva
        confirmada y futura. Los campos omitidos se conservan. Enviar attributes
        reemplaza el objeto completo; no mezcla claves. Se prohíben null y campos
        no admitidos. expectedVersion no fija la nueva versión.

        Horario y recurso solo pueden cambiar dentro del plazo evaluado con el
        inicio anterior y la duración original. Los cambios exclusivamente de
        atributos siguen sujetos a estar antes del inicio y al esquema contextual.
        Responsable y condiciones originales son inmutables. La futura validación
        de disponibilidad excluye la ocupación de la propia reserva y aplica todo
        el cambio o conserva íntegra la versión anterior. El mock no lo ejecuta.
      operationId: updateReservation
      requestBody:
        content:
          application/json:
            examples:
              changeInterval:
                $ref: '#/components/examples/UpdateRequest'
              changeResource:
                value:
                  expectedVersion: 1
                  resourceId: 00000000-0000-4000-8000-100000000002
              replaceAttributes:
                value:
                  attributes: {}
                  expectedVersion: 1
            schema:
              $ref: '#/components/schemas/UpdateReservationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                updated:
                  $ref: '#/components/examples/UpdatedReservation'
              schema:
                $ref: '#/components/schemas/ConfirmedReservation'
          description: Reserva actualizada; un cambio efectivo incrementará version y updatedAt.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ReservationOrResourceNotFound'
        "409":
          content:
            application/json:
              examples:
                cancelledReservation:
                  $ref: '#/components/examples/StateConflict'
                collision:
                  $ref: '#/components/examples/ResourceUnavailable'
                versionConflict:
                  $ref: '#/components/examples/VersionConflict'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Versión desactualizada, estado incompatible o conflicto de disponibilidad.
        "422":
          $ref: '#/components/responses/InvalidModification'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Modificar una reserva propia
      tags:
        - Reservas
      x-permission: reservas:operar
  /api/v1/reservas/{id}/cancelaciones:
    parameters:
      - $ref: '#/components/parameters/MockScenario'
      - $ref: '#/components/parameters/ReservationId'
    post:
      description: |
        Conserva la reserva y su historial con estado cancelled. Si sigue
        confirmada, exige la versión vigente y permite cancelar solo cuando
        ahora < inicio y ahora <= inicio - plazo original.

        Tras validar autenticación, formato y propiedad, una cancelación ya
        completada devuelve 200 con la representación actual, incluso si la
        versión esperada válida es anterior o el plazo ya venció. No repite
        transición, liberación, auditoría ni notificación. El mock solo ofrece
        los ejemplos de respuesta; no implementa estos efectos.
      operationId: cancelReservation
      requestBody:
        content:
          application/json:
            examples:
              cancel:
                $ref: '#/components/examples/CancelRequest'
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelledReservation'
              schema:
                $ref: '#/components/schemas/CancelledReservation'
          description: Reserva cancelada, incluyendo la respuesta de un reintento autorizado.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/ReservationNotFound'
        "409":
          content:
            application/json:
              examples:
                versionConflict:
                  $ref: '#/components/examples/VersionConflict'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: La reserva confirmada tiene otra versión.
        "422":
          content:
            application/json:
              examples:
                alreadyStarted:
                  $ref: '#/components/examples/AlreadyStarted'
                deadlineExpired:
                  $ref: '#/components/examples/CancellationWindowClosed'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El plazo original venció o la reserva ya comenzó.
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Cancelar una reserva propia
      tags:
        - Reservas
      x-permission: reservas:operar
security:
  - BearerAuth: []
servers:
  - description: Servidor HTTP mock del Hito 1. Respuestas de demostración sin persistencia.
    url: /
tags:
  - description: Creación y gestión personal de reservas de un único recurso.
    name: Reservas
  - description: Catálogo visible para alimentar el formulario.
    name: Recursos
  - description: Ventanas libres para el calendario, sin retener recursos.
    name: Disponibilidad
  - description: Gestión administrativa del catálogo de recursos, políticas, horarios recurrentes y bloqueos del ámbito.
    name: Administración de Recursos
  - description: Consulta de reservas de todos los usuarios del ámbito administrado, sin permisos de modificación o cancelación de terceros.
    name: Administración de Reservas
