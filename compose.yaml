name: bookingms-demo

services:
  mock-api:
    image: bookingms/mock-api:demo
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      MOCK_ADDR: 0.0.0.0:4010
    ports:
      - "127.0.0.1:4010:4010"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  frontend:
    image: bookingms/frontend:demo
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    depends_on:
      mock-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  swagger-ui:
    image: bookingms/swagger-ui:demo
    build:
      context: .
      dockerfile: infra/swagger/Dockerfile
    depends_on:
      mock-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BASE_URL: /docs
      SWAGGER_JSON: /contracts/openapi.yaml
      VALIDATOR_URL: none
      DOC_EXPANSION: list
      DISPLAY_REQUEST_DURATION: "true"
      # Tokens de demostración: demo-user o demo-admin. No es autenticación real.
      SUPPORTED_SUBMIT_METHODS: '["get", "post", "patch", "put", "delete"]'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./contracts/openapi/openapi.yaml:/contracts/openapi.yaml:ro
    healthcheck:
      test: [CMD, wget, --spider, -q, "http://127.0.0.1:8080/docs/"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    restart: unless-stopped
