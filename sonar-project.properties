sonar.projectKey=bookingms-backend
sonar.projectName=BookingMS Go y Vue
sonar.sourceEncoding=UTF-8

sonar.sources=Backend,Frontend/src,Frontend/scripts
sonar.tests=Backend,Frontend/tests
sonar.inclusions=**/*.go,**/*.ts,**/*.vue,**/*.mjs
sonar.exclusions=**/*_test.go,**/*.d.ts,**/node_modules/**,**/dist/**,**/bin/**
sonar.test.inclusions=**/*_test.go,Frontend/tests/**/*.test.ts,Frontend/tests/e2e/**/*.spec.ts

sonar.go.coverage.reportPaths=reports/coverage.out
sonar.testExecutionReportPaths=reports/go-tests.xml
sonar.javascript.lcov.reportPaths=reports/frontend/lcov.info
sonar.working.directory=/tmp/bookingms-scanner
sonar.scanner.metadataFilePath=/usr/src/reports/sonar/report-task.txt
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
