sonar.organization=pingeso-civil
sonar.projectKey=PINGESO-CIVIL_BookingMicroservice
sonar.projectName=BookingMicroservice
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api,apps/web/src,apps/web/scripts
sonar.tests=apps/api,apps/web/tests
sonar.inclusions=**/*.go,**/*.ts,**/*.tsx,**/*.mjs
sonar.exclusions=**/*_test.go,**/*.d.ts,**/repository/**,**/*.gen.go,**/node_modules/**,**/dist/**,**/package-dist/**,**/bin/**,apps/web/src/componentes/ui/**
sonar.test.inclusions=**/*_test.go,apps/web/tests/**/*.test.ts,apps/web/tests/**/*.test.tsx,apps/web/tests/e2e/**/*.spec.ts

sonar.go.coverage.reportPaths=reports/coverage.out
sonar.javascript.lcov.reportPaths=reports/frontend/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
