operations:
  listAdminReservations:
    tags:
      - Administración de Reservas
    x-permission: reservas:administrar
    summary: Listar reservas de todos los usuarios del ámbito administrado
    description: |
      Requiere administrador de ámbito. Incluye reservas confirmadas y
      canceladas de todos los responsables del ámbito derivado de la identidad.
      No acepta otro ámbito ni permite ampliar el acceso desde un filtro.
      Mantiene orden startAt e id ascendentes, filtros por recurso, estado y
      solapamiento, y paginación por cursor. No habilita crear para terceros,
      modificar ni cancelar sus reservas. El mock requiere demo-admin.
    parameters:
      - $ref: "#/components/parameters/ResourceFilter"
      - $ref: "#/components/parameters/StatusFilter"
      - $ref: "#/components/parameters/OptionalFrom"
      - $ref: "#/components/parameters/OptionalTo"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
    responses:
      "200":
        description: Página de reservas del ámbito, con la referencia de identidad de cada responsable; vacío no es un error.
        content:
          application/json:
            examples:
              reservations:
                $ref: "#/components/examples/AdminReservationPage"
              empty:
                value:
                  items: []
                  nextCursor: null
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters:
      - $ref: "#/components/parameters/MockScenario"
  createReservation:
    tags:
      - Reservas
    x-permission: reservas:operar
    summary: Crear una reserva personal
    description: |
      Crea una reserva confirmada para el usuario autenticado. La futura
      implementación debe validar recurso, horarios, bloqueos, colisiones y
      políticas, y guardar atómicamente la ocupación y el plazo aceptado.
      Repetir Idempotency-Key y contenido devuelve el resultado original sin
      duplicar efectos. La retención y el alcance técnico de la clave quedan
      pendientes para el hito de lógica real; el mock solo muestra ejemplos.
    parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      - name: X-Request-Id
        in: header
        description: Identificador de correlación para el envío de la confirmación.
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          examples:
            genericReservation:
              $ref: "#/components/examples/CreateRequest"
    responses:
      "201":
        description: Reserva confirmada; en el mock es una respuesta prefijada sin escritura.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedReservation"
            examples:
              confirmed:
                $ref: "#/components/examples/ConfirmedReservation"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ResourceNotFound"
      "409":
        description: Colisión, bloqueo o misma clave de idempotencia con otro contenido.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              collision:
                $ref: "#/components/examples/ResourceUnavailable"
              blocked:
                $ref: "#/components/examples/ResourceBlocked"
              idempotencyConflict:
                $ref: "#/components/examples/IdempotencyConflict"
      "422":
        $ref: "#/components/responses/InvalidCreation"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: &a1
      - $ref: "#/components/parameters/MockScenario"
  listReservations:
    tags:
      - Reservas
    x-permission: reservas:leer
    summary: Listar reservas propias
    description: |
      Solo devuelve reservas propias del ámbito autenticado. Sin status incluye
      confirmadas y canceladas. from y to deben enviarse juntos; el filtro
      selecciona solapamientos: startAt < to y endAt > from.
      Sin rango permite consultar el historial paginado. Orden: startAt e id
      ascendentes. El límite de 31 días de disponibilidad no limita este listado.
      Los ejemplos no ejecutan filtros ni paginación real.
    parameters:
      - $ref: "#/components/parameters/ResourceFilter"
      - $ref: "#/components/parameters/StatusFilter"
      - $ref: "#/components/parameters/OptionalFrom"
      - $ref: "#/components/parameters/OptionalTo"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
    responses:
      "200":
        description: Página de reservas propias; una búsqueda sin resultados no es un error.
        content:
          application/json:
            examples:
              reservations:
                $ref: "#/components/examples/ReservationPage"
              empty:
                value:
                  items: []
                  nextCursor: null
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: *a1
  getReservation:
    tags:
      - Reservas
    x-permission: reservas:leer
    summary: Consultar una reserva propia
    description: |
      Consulta una reserva confirmada o cancelada sin alterar estado ni versión.
      Una reserva inexistente, ajena o de otro ámbito produce el mismo 404.
      version permite construir expectedVersion en posteriores escrituras.
    responses:
      "200":
        description: Representación vigente; el mock devuelve el ejemplo seleccionado.
        content:
          application/json:
            examples:
              confirmed:
                $ref: "#/components/examples/ConfirmedReservation"
              cancelled:
                $ref: "#/components/examples/CancelledReservation"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ReservationNotFound"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: &a2
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ReservationId"
  updateReservation:
    tags:
      - Reservas
    x-permission: reservas:operar
    summary: Modificar una reserva propia
    description: |
      Solicita un cambio parcial de horario, recurso o attributes de una reserva
      confirmada y futura. Los campos omitidos se conservan. Enviar attributes
      reemplaza el objeto completo; no mezcla claves. Se prohíben null y campos
      no admitidos. expectedVersion no fija la nueva versión.

      Horario y recurso solo pueden cambiar dentro del plazo evaluado con el
      inicio anterior y la duración original. Los cambios exclusivamente de
      atributos siguen sujetos a estar antes del inicio y al esquema contextual.
      Responsable y condiciones originales son inmutables. La futura validación
      de disponibilidad excluye la ocupación de la propia reserva y aplica todo
      el cambio o conserva íntegra la versión anterior. El mock no lo ejecuta.
    requestBody:
      required: true
      content:
        application/json:
          examples:
            changeInterval:
              $ref: "#/components/examples/UpdateRequest"
            changeResource:
              value:
                expectedVersion: 1
                resourceId: 00000000-0000-4000-8000-100000000002
            replaceAttributes:
              value:
                expectedVersion: 1
                attributes: {}
    responses:
      "200":
        description: Reserva actualizada; un cambio efectivo incrementará version y updatedAt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedReservation"
            examples:
              updated:
                $ref: "#/components/examples/UpdatedReservation"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ReservationOrResourceNotFound"
      "409":
        description: Versión desactualizada, estado incompatible o conflicto de disponibilidad.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              versionConflict:
                $ref: "#/components/examples/VersionConflict"
              cancelledReservation:
                $ref: "#/components/examples/StateConflict"
              collision:
                $ref: "#/components/examples/ResourceUnavailable"
      "422":
        $ref: "#/components/responses/InvalidModification"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: *a2
  cancelReservation:
    tags:
      - Reservas
    x-permission: reservas:operar
    summary: Cancelar una reserva propia
    description: |
      Conserva la reserva y su historial con estado cancelled. Si sigue
      confirmada, exige la versión vigente y permite cancelar solo cuando
      ahora < inicio y ahora <= inicio - plazo original.

      Tras validar autenticación, formato y propiedad, una cancelación ya
      completada devuelve 200 con la representación actual, incluso si la
      versión esperada válida es anterior o el plazo ya venció. No repite
      transición, liberación, auditoría ni notificación. El mock solo ofrece
      los ejemplos de respuesta; no implementa estos efectos.
    requestBody:
      required: true
      content:
        application/json:
          examples:
            cancel:
              $ref: "#/components/examples/CancelRequest"
    responses:
      "200":
        description: Reserva cancelada, incluyendo la respuesta de un reintento autorizado.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelledReservation"
            examples:
              cancelled:
                $ref: "#/components/examples/CancelledReservation"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ReservationNotFound"
      "409":
        description: La reserva confirmada tiene otra versión.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              versionConflict:
                $ref: "#/components/examples/VersionConflict"
      "422":
        description: El plazo original venció o la reserva ya comenzó.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              deadlineExpired:
                $ref: "#/components/examples/CancellationWindowClosed"
              alreadyStarted:
                $ref: "#/components/examples/AlreadyStarted"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters:
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ReservationId"
  listResources:
    tags:
      - Recursos
    x-permission: recursos:leer
    summary: Listar recursos visibles
    description: |
      Catálogo visible del ámbito autenticado, ordenado por id ascendente.
      enabled por defecto true alimenta el selector de recursos habilitados;
      false selecciona deshabilitados visibles. Estar habilitado no garantiza
      disponibilidad de un intervalo. No admite filtros arbitrarios de atributos.
    parameters:
      - name: enabled
        in: query
        description: Filtra por habilitación, sin ampliar la autorización.
        schema:
          type: boolean
          default: true
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
    responses:
      "200":
        description: Página de recursos visibles o lista vacía.
        content:
          application/json:
            examples:
              resources:
                $ref: "#/components/examples/ResourcePage"
              empty:
                value:
                  items: []
                  nextCursor: null
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: &a3
      - $ref: "#/components/parameters/MockScenario"
  createResource:
    tags:
      - Administración de Recursos
    x-permission: recursos:administrar
    summary: Crear un recurso reservable en el ámbito
    description: |
      Registra un nuevo recurso exclusivo dentro del ámbito autorizado del
      administrador. Define nombre visible, habilitación inicial, zona horaria
      IANA, referencia opcional a un catálogo externo, política inicial y
      atributos del recurso. En la fase de mocks devuelve un ejemplo prefijado.
    requestBody:
      required: true
      content:
        application/json:
          examples:
            createResource:
              $ref: "#/components/examples/CreateResourceRequest"
    responses:
      "201":
        description: Recurso creado; en el mock devuelve una respuesta simulada.
        content:
          application/json:
            examples:
              created:
                $ref: "#/components/examples/ResourceDetail"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "422":
        description: Política o atributos del recurso no válidos.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              policyViolation:
                $ref: "#/components/examples/PolicyViolation"
              invalidAttributes:
                $ref: "#/components/examples/InvalidAttributes"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: *a3
  getResource:
    tags:
      - Administración de Recursos
    x-permission: recursos:administrar
    summary: Consultar detalle administrativo de un recurso
    description: |
      Devuelve la configuración completa de un recurso del ámbito, incluyendo
      su versión vigente, referencia a catálogo externo, política de tiempo y
      cancelación, horario semanal recurrente y bloqueos activos.
    responses:
      "200":
        description: Detalle administrativo del recurso.
        content:
          application/json:
            examples:
              detail:
                $ref: "#/components/examples/ResourceDetail"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ResourceNotFound"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: &a4
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ResourceId"
  updateResource:
    tags:
      - Administración de Recursos
    x-permission: recursos:administrar
    summary: Modificar estado, política o metadatos de un recurso
    description: |
      Actualiza parcialmente nombre, habilitación (enabled), zona horaria,
      referencia externa, política o atributos del recurso exigiendo
      expectedVersion. Cambiar cancellationNoticeSeconds rige únicamente para
      nuevas reservas y no altera el plazo original aceptado por reservas ya
      confirmadas (REQ-031). Si se intenta deshabilitar un recurso que posee
      reservas futuras confirmadas, se rechaza íntegramente con 409 (REQ-012).
    requestBody:
      required: true
      content:
        application/json:
          examples:
            updatePolicyAndState:
              $ref: "#/components/examples/UpdateResourceRequest"
    responses:
      "200":
        description: Recurso actualizado con versión incrementada.
        content:
          application/json:
            examples:
              updated:
                $ref: "#/components/examples/UpdatedResourceDetail"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ResourceNotFound"
      "409":
        description: Versión desactualizada del recurso o conflicto con reservas confirmadas al deshabilitar.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              versionConflict:
                $ref: "#/components/examples/ResourceVersionConflict"
              scheduleConflict:
                $ref: "#/components/examples/ResourceScheduleConflict"
      "422":
        description: Política o atributos del recurso no válidos.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              policyViolation:
                $ref: "#/components/examples/PolicyViolation"
              invalidAttributes:
                $ref: "#/components/examples/InvalidAttributes"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters: *a4
  updateResourceSchedule:
    tags:
      - Administración de Recursos
    x-permission: recursos:administrar
    summary: Configurar horario semanal recurrente y límites de duración
    description: |
      Reemplaza las franjas horarias recurrentes del recurso (interpretadas en
      la zona IANA del recurso) y su política de duración mínima/máxima,
      exigiendo expectedVersion. Si el nuevo horario deja fuera del rango
      habilitado alguna reserva futura confirmada, la operación se rechaza
      íntegramente con 409 RESOURCE_SCHEDULE_CONFLICT sin cancelar ni
      reubicar reservas silenciosamente (REQ-012, AC-021).
    requestBody:
      required: true
      content:
        application/json:
          examples:
            weeklySchedule:
              $ref: "#/components/examples/UpdateResourceScheduleRequest"
    responses:
      "200":
        description: Horario y reglas temporales actualizados.
        content:
          application/json:
            examples:
              updated:
                $ref: "#/components/examples/UpdatedResourceDetail"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ResourceNotFound"
      "409":
        description: Versión desactualizada o conflicto del nuevo horario con reservas confirmadas.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              scheduleConflict:
                $ref: "#/components/examples/ResourceScheduleConflict"
              versionConflict:
                $ref: "#/components/examples/ResourceVersionConflict"
      "422":
        description: Reglas horarias o límites de duración inconsistentes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              invalidInterval:
                $ref: "#/components/examples/InvalidInterval"
              policyViolation:
                $ref: "#/components/examples/PolicyViolation"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters:
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ResourceId"
  createResourceClosure:
    tags:
      - Administración de Recursos
    x-permission: recursos:administrar
    summary: Registrar un bloqueo o cierre excepcional sobre un recurso
    description: |
      Registra un intervalo semiabierto [startAt, endAt) de indisponibilidad
      por mantenimiento o cierre administrativo. Si el bloqueo se solapa con
      una reserva confirmada vigente en ese recurso, se rechaza con 409
      RESOURCE_SCHEDULE_CONFLICT para que el actor autorizado resuelva el
      conflicto antes de aplicar el cierre (REQ-012, AC-021).
    requestBody:
      required: true
      content:
        application/json:
          examples:
            maintenanceClosure:
              $ref: "#/components/examples/CreateResourceClosureRequest"
    responses:
      "201":
        description: Bloqueo temporal registrado sobre el recurso.
        content:
          application/json:
            examples:
              createdClosure:
                $ref: "#/components/examples/ResourceClosure"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ResourceNotFound"
      "409":
        description: El bloqueo propuesto entra en conflicto con reservas confirmadas existentes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              scheduleConflict:
                $ref: "#/components/examples/ResourceScheduleConflict"
      "422":
        description: Intervalo de bloqueo inválido (startAt >= endAt).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              invalidInterval:
                $ref: "#/components/examples/InvalidInterval"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters:
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ResourceId"
  deleteResourceClosure:
    tags:
      - Administración de Recursos
    x-permission: recursos:administrar
    summary: Eliminar un bloqueo o cierre excepcional de un recurso
    description: |
      Levanta un bloqueo excepcional previamente registrado sobre el recurso,
      restituyendo la disponibilidad gobernada por su horario recurrente.
    responses:
      "204":
        description: Bloqueo eliminado correctamente.
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        description: Recurso o bloqueo inexistente en el ámbito autorizado.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              closureNotFound:
                $ref: "#/components/examples/ClosureNotFound"
              resourceNotFound:
                $ref: "#/components/examples/ResourceNotFound"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters:
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/ClosureId"
  getResourceAvailability:
    tags:
      - Disponibilidad
    x-permission: recursos:leer
    summary: Consultar disponibilidad de un recurso
    description: |
      Ventanas continuas libres ordenadas, sin solapamientos y dentro de
      [from, to). Exige ambos extremos y un máximo de 31 días por consulta.
      Ese máximo limita la carga del calendario, no la anticipación de reservas.
      La precisión temporal y el cómputo técnico del máximo en cambios de zona
      se cerrarán antes de implementar la lógica real.

      La futura implementación descuenta bloqueos y reservas confirmadas de
      todos los usuarios, sin exponer identidades ni motivos privados.
      availableWindows conserva las ventanas continuas y availableSlots
      ofrece bloques completos según slotDurationSeconds del recurso,
      alineados a cada apertura semanal y sin reservas ni bloqueos solapados.
      Ningún bloque garantiza disponibilidad para una creación posterior.
      Un recurso visible deshabilitado devuelve enabled=false y
      availableWindows vacío. Una consulta sin ventanas libres devuelve 200.
      No se permite excluir una reserva mediante parámetros en esta consulta.
      Los intervalos del mock son ejemplos estáticos, no cálculos reales.
    parameters:
      - name: from
        in: query
        required: true
        description: Inicio inclusivo del rango, con zona explícita.
        schema:
          $ref: "#/components/schemas/DateTime"
        example: 2026-11-10T21:00:00Z
      - name: to
        in: query
        required: true
        description: Término exclusivo, posterior a from; máximo 31 días de rango.
        schema:
          $ref: "#/components/schemas/DateTime"
        example: 2026-11-11T01:00:00Z
    responses:
      "200":
        description: Disponibilidad del rango solicitado, sin datos privados de otras reservas.
        content:
          application/json:
            examples:
              available:
                $ref: "#/components/examples/Availability"
              noAvailability:
                $ref: "#/components/examples/NoAvailability"
              disabledResource:
                $ref: "#/components/examples/DisabledAvailability"
      "400":
        $ref: "#/components/responses/BadRequest"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/ResourceNotFound"
      "500":
        $ref: "#/components/responses/InternalError"
      "503":
        $ref: "#/components/responses/Unavailable"
    pathParameters:
      - $ref: "#/components/parameters/MockScenario"
      - $ref: "#/components/parameters/ResourceId"
