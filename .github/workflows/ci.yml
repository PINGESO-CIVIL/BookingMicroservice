name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.76.1
  GOVULNCHECK_VERSION: v1.9.0
  OASDIFF_VERSION: v1.35.0
  DOCKLE_VERSION: v0.4.15

jobs:
  calidad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Instalar dependencias y comprobar la generación de OpenAPI
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          make generate
          git diff --exit-code
      - name: Probar la API y React
        run: |
          mkdir -p reports/sonar
          cd apps/api
          go mod verify
          go vet ./...
          go test -covermode=atomic -coverprofile=../../reports/coverage.out ./...
          cd ../..
          sed -i 's|^bookingms/|apps/api/|' reports/coverage.out
          pnpm lint
          pnpm typecheck
          pnpm --dir apps/web build
          pnpm --dir apps/web build:package
          pnpm --dir apps/web test:coverage
          TZ=UTC pnpm --dir apps/web exec vitest run tests/contracts.test.ts
          TZ=Pacific/Auckland pnpm --dir apps/web exec vitest run tests/contracts.test.ts
          sed -i 's|^SF:src/|SF:apps/web/src/|' reports/frontend/lcov.info
      - name: Probar el entorno Compose
        env:
          API_ENV: dev
          FRONTEND_URL: http://127.0.0.1:5190
          BOOKING_DB_PASSWORD: ci-ephemeral-postgres-password
        run: |
          docker compose up -d --build --wait
          pnpm --dir apps/web verify:http
          BOOKING_E2E_API_URL=http://127.0.0.1:5191 go -C apps/api test -count=1 ./e2e
      - name: Probar la interfaz en Chromium
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web test:e2e
      - name: Detener Compose
        if: always()
        run: docker compose down --volumes
      - name: Verificar compatibilidad del contrato
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$RUNNER_TEMP/base-openapi.yaml"
          if ! git show "${BASE_SHA}:contracts/openapi.yaml" > "$base"; then
            git show "${BASE_SHA}:contracts/openapi/openapi.yaml" > "$base"
          fi
          go run "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}" breaking "$base" contracts/openapi.yaml --fail-on ERR
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  seguridad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
      # gitleaks 8.30.1 por CLI: gitleaks-action exige licencia de pago en repos de organizaciones.
      - name: Gitleaks
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
      - name: Auditar vulnerabilidades en Go
        run: cd apps/api && go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Auditar vulnerabilidades en npm
        run: pnpm audit --audit-level high
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0 (hadolint v2.15.1)
        with:
          recursive: true
          failure-threshold: error
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  imagen:
    needs: [calidad, seguridad]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -f apps/api/Dockerfile --build-arg VERSION=${GITHUB_SHA::7} -t api:ci .
      - run: docker build --pull -f apps/web/Dockerfile -t web:ci .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: web:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "goodwithtech/dockle:${DOCKLE_VERSION}" --exit-code 1 --exit-level warn api:ci
