name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  TRIVY_VERSION: v0.76.1
  COSIGN_VERSION: v3.1.4
  REGISTRY: ghcr.io

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@pingeso-civil'

      - name: Iniciar sesión en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir y publicar imágenes api y migrate
        id: images
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          API_IMAGE="${REGISTRY}/${OWNER_LOWER}/bookingms-api"
          MIGRATE_IMAGE="${REGISTRY}/${OWNER_LOWER}/bookingms-migrate"

          docker build --pull -f apps/api/Dockerfile --build-arg "VERSION=${SHA_SHORT}" -t "${API_IMAGE}:${SHA_SHORT}" .
          docker build --pull -f apps/api/Dockerfile.migrate -t "${MIGRATE_IMAGE}:${SHA_SHORT}" .

          docker push "${API_IMAGE}:${SHA_SHORT}"
          docker push "${MIGRATE_IMAGE}:${SHA_SHORT}"

          API_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${API_IMAGE}:${SHA_SHORT}")
          MIGRATE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${MIGRATE_IMAGE}:${SHA_SHORT}")

          echo "api_ref=${API_IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "migrate_ref=${MIGRATE_IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "api_digest=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "migrate_digest=${MIGRATE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generar SBOM CycloneDX (api)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.images.outputs.api_ref }}
          format: cyclonedx
          output: sbom-api.cdx.json

      - name: Generar SBOM CycloneDX (migrate)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.images.outputs.migrate_ref }}
          format: cyclonedx
          output: sbom-migrate.cdx.json

      - name: Firmar imágenes con Cosign (keyless OIDC)
        run: |
          docker run --rm \
            -e COSIGN_YES=true \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "$HOME/.docker:/root/.docker:ro" \
            "ghcr.io/sigstore/cosign/cosign:${COSIGN_VERSION}" sign \
            "${{ steps.images.outputs.api_digest }}" \
            "${{ steps.images.outputs.migrate_digest }}"

      - name: Construir y publicar microcomponentes en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir apps/web build:package
          pnpm --dir apps/web publish --no-git-checks --access restricted

      - name: Publicar GitHub Release con OpenAPI y SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            contracts/openapi.yaml \
            sbom-api.cdx.json \
            sbom-migrate.cdx.json \
            --generate-notes
