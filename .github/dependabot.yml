version: 2
updates:
  - package-ecosystem: npm
    directories: [/, /apps/web]
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
